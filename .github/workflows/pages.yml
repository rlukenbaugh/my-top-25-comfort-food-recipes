name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install PDF dependencies
        run: pip install -r requirements.txt
      - name: Install web test dependencies
        run: npm ci
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Validate recipe data
        run: python validate_recipes.py
      - name: Build printable PDF
        run: python build_recipe_book.py
      - name: Verify printable PDF
        run: python verify_book.py
      - name: Run interaction and accessibility tests
        run: npm run test:e2e
      - name: Assemble website
        shell: bash
        run: |
          mkdir -p _site/printable
          cp index.html styles-v1.5.css app-v1.5.js recipes.json manifest.webmanifest service-worker.js _site/
          cp -r assets _site/
          cp outputs/*.pdf _site/printable/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
