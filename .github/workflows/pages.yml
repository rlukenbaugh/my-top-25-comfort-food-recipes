name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install PDF dependencies
        run: pip install -r requirements.txt
      - name: Install web test dependencies
        run: npm ci
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Validate recipe data
        run: python validate_recipes.py
      - name: Build printable PDF
        run: python build_recipe_book.py
      - name: Verify printable PDF
        run: python verify_book.py
      - name: Test private importer bridge
        run: npm run test:bridge
      - name: Run interaction and accessibility tests
        run: npm run test:e2e
      - name: Assemble website
        run: python assemble_site.py --output _site --version ${{ github.sha }}
      - name: Verify versioned website output
        run: python verify_web_build.py --site _site --version ${{ github.sha }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
